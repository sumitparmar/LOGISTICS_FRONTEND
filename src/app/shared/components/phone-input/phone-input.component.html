<div class="phone-input">
    <div class="country-select">
        <span class="country-flag" role="img" aria-label="India"></span>
        <span class="country-code" aria-label="Country code">{{ countryCode }} India</span>
    </div>
    <input type="tel" [value]="value" [placeholder]="placeholder" [autocomplete]="autocomplete"
        inputmode="numeric" maxlength="10" [disabled]="disabled" (input)="onInput($event)"
        (blur)="onBlur()" aria-label="Mobile number" />
</div>
