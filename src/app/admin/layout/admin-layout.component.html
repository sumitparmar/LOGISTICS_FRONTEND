<div class="admin-shell" [class.menu-open]="isMobileMenuOpen">

    <!-- Sidebar -->
    <aside class="admin-sidebar" [class.open]="isMobileMenuOpen" (click)="$event.stopPropagation()">

        <div class="admin-logo" (click)="navigateAdmin('/admin', $event)" aria-label="MoveKart admin home"> <img class="admin-logo-image"
                src="assets/images/movekart-logo.png" alt="MoveKart" />
            <span class="logo-sub"> Admin</span>
            <button class="admin-sidebar-close" type="button" aria-label="Close admin menu"
                (click)="closeMobileMenu(); $event.stopPropagation()">
                <lucide-icon name="x"></lucide-icon>
            </button>
        </div>

        <nav class="admin-menu">

            <!-- Dashboard -->
            <button type="button" [class.active]="isAdminRoute('/admin')" (click)="navigateAdmin('/admin', $event)">
                <lucide-icon name="home"></lucide-icon>
                <span>Dashboard</span>
            </button>

            <!-- Orders -->
            <button *ngIf="permissionService.has('orders.read')" type="button"
                [class.active]="isAdminRoute('/admin/orders')" (click)="navigateAdmin('/admin/orders', $event)">
                <lucide-icon name="shopping-cart"></lucide-icon>
                <span>Orders</span>
            </button>

            <!-- Users -->
            <button *ngIf="permissionService.has('users.read')" type="button"
                [class.active]="isAdminRoute('/admin/users')" (click)="navigateAdmin('/admin/users', $event)">
                <lucide-icon name="users"></lucide-icon>
                <span>Users</span>
            </button>

            <!-- Drivers -->
            <button *ngIf="permissionService.has('drivers.read')" type="button"
                [class.active]="isAdminRoute('/admin/drivers')" (click)="navigateAdmin('/admin/drivers', $event)">
                <lucide-icon name="truck"></lucide-icon>
                <span>Drivers</span>
            </button>

            <!-- Payments -->
            <button *ngIf="permissionService.has('payments.read')" type="button"
                [class.active]="isAdminRoute('/admin/payments')" (click)="navigateAdmin('/admin/payments', $event)">
                <lucide-icon name="credit-card"></lucide-icon>
                <span>Payments</span>
            </button>

            <!-- Pricing -->
            <button *ngIf="permissionService.has('pricing.read')" type="button"
                [class.active]="isAdminRoute('/admin/pricing')" (click)="navigateAdmin('/admin/pricing', $event)">
                <lucide-icon name="tag"></lucide-icon>
                <span>Pricing</span>
            </button>

            <!-- Notifications -->
            <button *ngIf="permissionService.has('notifications.read')" type="button"
                [class.active]="isAdminRoute('/admin/notifications')"
                (click)="navigateAdmin('/admin/notifications', $event)">
                <lucide-icon name="bell"></lucide-icon>

                <span class="menu-item">
                    Notifications
                    <span *ngIf="unreadCount > 0" class="badge">
                        {{ unreadCount }}
                    </span>
                </span>
            </button>

            <!-- Support -->
            <button *ngIf="permissionService.has('support.read')" type="button"
                [class.active]="isAdminRoute('/admin/support')" (click)="navigateAdmin('/admin/support', $event)">
                <lucide-icon name="life-buoy"></lucide-icon>
                <span>Support</span>
            </button>

            <!-- Customer feedback -->
            <button *ngIf="permissionService.has('reviews.read')" type="button"
                [class.active]="isAdminRoute('/admin/reviews')" (click)="navigateAdmin('/admin/reviews', $event)">
                <lucide-icon name="message-square"></lucide-icon>
                <span>Feedback</span>
            </button>

            <!-- Roles -->
            <button *ngIf="permissionService.has('users.read')" type="button"
                [class.active]="isAdminRoute('/admin/roles')" (click)="navigateAdmin('/admin/roles', $event)">
                <lucide-icon name="shield"></lucide-icon>
                <span>Roles</span>
            </button>

            <!-- Settings -->
            <button type="button" [class.active]="isAdminRoute('/admin/settings')"
                (click)="navigateAdmin('/admin/settings', $event)">
                <lucide-icon name="settings"></lucide-icon>
                <span>Settings</span>
            </button>

        </nav>


    </aside>

    <div class="admin-drawer-backdrop" *ngIf="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

    <!-- Main -->
    <div class="admin-main">

        <!-- Navbar -->
        <header class="admin-navbar">

            <button class="admin-menu-toggle" type="button" aria-label="Open admin menu"
                (click)="toggleMobileMenu($event)">
                <lucide-icon name="menu"></lucide-icon>
            </button>

            <!-- Search -->
            <div class="search-box">
                <lucide-icon name="search"></lucide-icon>

                <input type="text" placeholder="Search orders, users..." [(ngModel)]="globalSearch"
                    (keyup.enter)="runGlobalSearch()" />
            </div>

            <!-- Right Section -->
            <div class="admin-actions">

                <app-theme-toggle></app-theme-toggle>

                <!--  Notification Bell -->
                <div *ngIf="permissionService.has('notifications.read')" class="notification-wrapper"
                    (click)="toggleDropdown($event)">

                    <lucide-icon name="bell"></lucide-icon>

                    <!-- Badge -->
                    <span *ngIf="unreadCount > 0" class="notif-badge">
                        {{ unreadCount }}
                    </span>

                    <!-- Dropdown -->
                    <div class="notif-dropdown" *ngIf="isDropdownOpen" (click)="$event.stopPropagation()">
                        <div class="notif-header">
                            Notifications
                        </div>

                        <div *ngIf="notifications.length === 0" class="empty">
                            No notifications
                        </div>

                        <div class="notif-item" *ngFor="let n of notifications | slice:0:5"
                            (click)="openNotification(n); $event.stopPropagation()">
                            <div class="title">{{ n.title }}</div>
                            <div class="message">{{ n.message }}</div>
                        </div>

                        <a class="view-all" (click)="goToNotifications($event)">
                            View all
                        </a>
                    </div>

                </div>

                <div class="admin-user" (click)="toggleUserMenu($event)">
                    <div class="avatar-wrapper">

                        <div class="avatar">
                            {{ currentUser?.name?.charAt(0) || 'A' }}
                        </div>

                        <span class="status-dot" [class.offline]="!isOnline"></span>
                    </div>

                    <div class="user-info">
                        <div class="name">
                            {{ currentUser?.name || 'Admin' }}
                        </div>
                        <div class="role">
                            {{
                            permissionService.isSuperAdmin()
                            ? 'Super Admin'
                            : currentUser?.adminRole?.name || 'Admin'
                            }}
                        </div>
                    </div>

                </div>

                <div class="user-dropdown" *ngIf="isUserMenuOpen" (click)="$event.stopPropagation()">

                    <button type="button" (click)="goDashboard()">
                        Dashboard
                    </button>

                    <button type="button" (click)="goSettings()">
                        Settings
                    </button>

                    <button type="button" class="danger" (click)="logout()">
                        Logout
                    </button>

                </div>
            </div>

        </header>

        <!-- Content -->
        <section class="admin-content">
            <router-outlet></router-outlet>
        </section>

    </div>

</div>

<app-admin-toast></app-admin-toast>
