<div class="customer-shell">

    <!-- Mobile Header -->
    <div class="mobile-only">
        <app-mobile-header (menuClicked)="toggleMobileMenu()">
        </app-mobile-header>
    </div>


    <!-- Mobile Drawer Overlay -->
    <app-mobile-drawer *ngIf="isMobileMenuOpen" (closed)="closeMobileMenu()">
    </app-mobile-drawer>


    <!-- Desktop Sidebar -->
    <div class="desktop-only">
        <app-customer-sidebar></app-customer-sidebar>
    </div>


    <!-- Main Content Area -->
    <div class="customer-main">

        <!-- Desktop Topbar -->
        <div class="desktop-only">
            <app-customer-topbar></app-customer-topbar>
        </div>


        <!-- Page Content -->
        <div class="customer-content">
            <router-outlet></router-outlet>
        </div>

    </div>


    <!-- Onboarding Modal -->
    <app-onboarding-modal *ngIf="showOnboarding" (selected)="onModeSelected($event)" (closed)="closeOnboarding()">
    </app-onboarding-modal>


</div>
