<div class="mobile-header">
    <button class="menu-btn" type="button" aria-label="Open menu" (click)="openMenu()">
        ☰
    </button>

    <div class="mobile-brand">

        <img src="assets/images/movekart-logo.png" alt="MoveKart Logistics" />

    </div>


    <div class="mobile-actions">

        <button *ngIf="isAdmin" class="admin-btn" type="button" (click)="openAdminPanel()" aria-label="Open admin panel">
            Admin
        </button>

        <button class="notification-btn" type="button" aria-label="Notifications" (click)="openNotifications()">
            🔔
            <span class="notification-badge" *ngIf="unreadCount > 0">
                {{ unreadCount }}
            </span>
        </button>

        <div class="profile-wrapper">
            <button class="avatar" [class.has-photo]="userPhoto" type="button" aria-label="Account" (click)="toggleDropdown($event)">
                <img *ngIf="userPhoto; else mobileInitial" [src]="userPhoto" alt="Profile photo" />
                <ng-template #mobileInitial>{{ userInitial }}</ng-template>
            </button>

            <div class="profile-dropdown" *ngIf="isDropdownOpen" (click)="$event.stopPropagation()">
                <div class="user-info">
                    {{ userName || 'Account' }}
                </div>

                <button type="button" class="dropdown-item" (click)="openProfile()">
                    My Profile
                </button>

                <button type="button" class="dropdown-item logout" (click)="logout()">
                    Logout
                </button>
            </div>
        </div>

    </div>

</div>
