<div class="customer-topbar">

    <div class="topbar-left">

        <div class="brand-content">

            <div class="brand-header">

                <div class="brand-logo">
                    <img src="assets/images/movekart-logo.png" alt="MoveKart Logistics" />
                </div>

                <div class="brand-text">

                    <p>
                        Deliver Faster. Track Smarter.
                    </p>

                </div>

                <div class="quick-highlights">

                    <div class="highlight-chip">
                        📦 Real-Time Tracking
                    </div>

                    <div class="highlight-chip">
                        🚛 Fast Delivery
                    </div>

                    <div class="highlight-chip">
                        🛡 Secure Logistics
                    </div>

                </div>

            </div>

        </div>

    </div>


    <div class="topbar-right">

        <app-theme-toggle></app-theme-toggle>
        <button *ngIf="isAdmin" class="admin-btn" type="button" (click)="openAdminPanel()">
            Admin Panel
        </button>


        <button class="notification-btn" type="button" (click)="goNotifications()">

            🔔

            <span class="notification-badge" *ngIf="unreadCount > 0">

                {{ unreadCount }}

            </span>

        </button>

        <div class="profile-wrapper">

            <button type="button" class="avatar" [class.has-photo]="userPhoto" (click)="toggleDropdown($event)">
                <img *ngIf="userPhoto; else topbarInitial" [src]="userPhoto" alt="Profile photo" />
                <ng-template #topbarInitial>{{ userInitial }}</ng-template>

            </button>

            <div class="profile-dropdown" *ngIf="isDropdownOpen">

                <div class="user-info">
                    {{ userName }}
                </div>

                <div class="dropdown-item" (click)="goProfile()">

                    My Profile

                </div>

                <div class="dropdown-item logout" (click)="logout()">

                    Logout

                </div>

            </div>

        </div>

    </div>

</div>
