<div class="settings-page">

    <div class="settings-container">

        <div class="settings-header">
            <div>
                <h2 class="page-title">Account settings</h2>
                <p class="page-subtitle">
                    Manage your profile, photo and password.
                </p>
            </div>
        </div>

        <div class="settings-grid">

            <!-- PROFILE -->
            <div class="settings-card">

                <div class="card-header">
                    <div>
                        <h3>Profile information</h3>
                    </div>
                </div>

                <form [formGroup]="profileForm" (submit)="$event.preventDefault()">
                    <div class="photo-field">
                        <div class="profile-photo-preview" [class.has-photo]="profilePhotoPreview">
                            <img *ngIf="profilePhotoPreview; else initialsAvatar" [src]="profilePhotoPreview"
                                alt="Profile photo" />
                            <ng-template #initialsAvatar>
                                <span>{{ initials }}</span>
                            </ng-template>
                        </div>

                        <div class="photo-actions">
                            <div class="photo-title-row">
                                <strong>Profile photo</strong>
                            </div>
                            <p>Add a display picture for your MoveKart account. JPG, PNG or WebP under 2 MB.</p>
                            <div class="photo-buttons">
                                <label class="photo-btn" for="profile-photo">
                                    {{ profilePhotoPreview ? 'Change photo' : 'Choose photo' }}
                                </label>
                                <button *ngIf="hasPendingPhotoChange" type="button" class="photo-btn"
                                    (click)="savePhoto()" [disabled]="photoSaving || loading">
                                    {{ photoSaving ? 'Saving...' : 'Save photo' }}
                                </button>
                                <button *ngIf="profilePhotoPreview" type="button" class="photo-btn secondary"
                                    (click)="removePhoto()" aria-label="Remove profile photo">
                                    Remove photo
                                </button>
                            </div>
                            <input id="profile-photo" type="file" accept="image/png,image/jpeg,image/webp"
                                (change)="onPhotoSelected($event)" />
                            <small *ngIf="photoError">{{ photoError }}</small>
                            <small class="photo-message" *ngIf="photoMessage && !photoError">{{ photoMessage }}</small>
                        </div>
                    </div>

                    <div class="crop-editor" *ngIf="cropSource">
                        <div class="crop-stage" aria-label="Profile photo crop preview">
                            <img [src]="cropSource" alt="Selected photo crop preview"
                                [style.transform]="cropImageTransform" />
                            <span class="crop-mask"></span>
                        </div>

                        <div class="crop-controls">
                            <label>
                                <span>Zoom</span>
                                <input type="range" min="1" max="3" step="0.05" [(ngModel)]="cropZoom"
                                    [ngModelOptions]="{ standalone: true }" />
                            </label>

                            <label>
                                <span>Horizontal</span>
                                <input type="range" min="-40" max="40" step="1" [(ngModel)]="cropOffsetX"
                                    [ngModelOptions]="{ standalone: true }" />
                            </label>

                            <label>
                                <span>Vertical</span>
                                <input type="range" min="-40" max="40" step="1" [(ngModel)]="cropOffsetY"
                                    [ngModelOptions]="{ standalone: true }" />
                            </label>

                            <div class="crop-actions">
                                <button type="button" class="photo-btn" (click)="applyCrop()">Apply crop</button>
                                <button type="button" class="photo-btn secondary" (click)="cancelCrop()">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <label>Name</label>
                        <input formControlName="name" autocomplete="name">
                    </div>

                    <div class="field">
                        <label>Email</label>
                        <input formControlName="email" autocomplete="email">
                    </div>

                    <div class="field">
                        <label>Phone</label>
                        <app-phone-input formControlName="phone"></app-phone-input>
                        <small *ngIf="profileForm.get('phone')?.touched && profileForm.get('phone')?.invalid">
                            Enter a valid 10 digit phone number.
                        </small>
                    </div>

                    <button type="button" class="btn-primary" (click)="updateProfile()"
                        [disabled]="profileForm.invalid || loading"> Update profile
                    </button>

                </form>

            </div>

            <!-- PASSWORD -->
            <div class="settings-card">

                <div class="card-header">
                    <div>
                        <h3>Password</h3>
                    </div>
                </div>

                <form [formGroup]="passwordForm" (submit)="$event.preventDefault()">
                    <div class="field">
                        <label>Current Password</label>
                        <input type="password" formControlName="currentPassword" autocomplete="current-password">
                    </div>

                    <div class="field">
                        <label>New Password</label>
                        <input type="password" formControlName="newPassword" autocomplete="new-password">
                    </div>

                    <button type="button" class="btn-primary" (click)="changePassword()"
                        [disabled]="passwordForm.invalid || loading"> Change Password
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
